name: App Store screenshots
on:
  workflow_dispatch:
    inputs:
      devices:
        description: "Which sets: iphone, ipad or all (Rowbin 1.0 is iPhone-only)"
        default: iphone
jobs:
  shots:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Select Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          xcodebuild -version
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - name: Build simulator app
        run: |
          set -o pipefail
          xcodebuild -project Rowbin.xcodeproj -scheme Rowbin -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -5
      - name: Unit tests
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcodebuild -project Rowbin.xcodeproj -scheme Rowbin -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO test 2>&1 | grep -E "Executed|error:|failed" | tail -5
      - name: Capture
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/Rowbin.app
          xcrun simctl list devicetypes | grep -E "Pro Max|iPhone 1[6-8] Pro" || true
          RT=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['isAvailable'] and x['platform']=='iOS']; print(r[-1]['identifier'])")
          pick() { xcrun simctl list devicetypes -j | python3 -c "import json,sys,re; t=[d for d in json.load(sys.stdin)['devicetypes'] if re.fullmatch(r'iPhone \d+ $1', d['name'])]; t.sort(key=lambda d:int(re.findall(r'\d+',d['name'])[0])); print(t[-1]['identifier'])"; }
          shoot() { # devicetype folder
            U=$(xcrun simctl create "shots-$2" "$1" "$RT"); D=store/$2; mkdir -p $D/raw
            xcrun simctl boot "$U"; xcrun simctl bootstatus "$U" -b
            xcrun simctl status_bar "$U" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --operatorName "" --batteryState charged --batteryLevel 100
            xcrun simctl install "$U" "$APP"
            n=1
            for s in shaping gauge eyesfree journal counter pattern markup voice dusk pro; do
              xcrun simctl terminate "$U" com.pocketappstudio.rowbin 2>/dev/null || true
              sleep 2; xcrun simctl launch "$U" com.pocketappstudio.rowbin -rowbinDemo $s; sleep 12
              xcrun simctl io "$U" screenshot --type=png "$D/raw/$n-$s.png"; n=$((n+1))
            done
            xcrun simctl shutdown "$U"
          }
          DEV="${{ github.event.inputs.devices || 'iphone' }}"
          if [ "$DEV" != ipad ]; then
            shoot "$(pick 'Pro Max')" iphone-6.9
            shoot "$(pick 'Pro')" iphone-6.3
          fi
          if [ "$DEV" != iphone ]; then
            IPAD=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys; t=[d for d in json.load(sys.stdin)['devicetypes'] if d['name'].startswith('iPad Pro 13-inch (M4)')]; print(t[0]['identifier'])")
            echo "iPad type: $IPAD"
            shoot "$IPAD" ipad-13
          fi
      - name: Add captions (same pixel size as the raw shots)
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 tools/caption_shots.py store
          python3 -c "import struct,glob; [print(f, struct.unpack('>II', open(f,'rb').read()[16:24])) for f in sorted(glob.glob('store/*/*.png'))]"
      - uses: actions/upload-artifact@v4
        with: { name: store-screenshots, path: store }
