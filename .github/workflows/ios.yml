name: iOS build & tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned simulator app
        run: |
          set -o pipefail
          xcodebuild -project Rowbin.xcodeproj -scheme Rowbin -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | tee build.log | xcpretty || (tail -200 build.log; exit 1)
      - name: Run unit tests
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulator: $UDID"
          xcodebuild -project Rowbin.xcodeproj -scheme Rowbin -destination "id=$UDID" -derivedDataPath build \
            -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO test | tee test.log | xcpretty || (tail -200 test.log; exit 1)
      - name: Simulator screenshots of the Pro screens
        if: success()
        run: |
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name 'Rowbin.app' | head -1)
          RT=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['isAvailable'] and x['platform']=='iOS']; print(r[-1]['identifier'])")
          BIG=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'SE' not in x['name']))")
          SE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next((x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if 'iPhone SE' in x['name']), ''))")
          if [ -z "$SE" ]; then SE=$(xcrun simctl create "iPhone SE shots" "com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation" "$RT" || true); fi
          shoot() { # udid folder
            U=$1; D=screens/$2; mkdir -p $D
            xcrun simctl boot "$U" || true; xcrun simctl bootstatus "$U" -b
            xcrun simctl status_bar "$U" override --time 9:41 --batteryState charged --batteryLevel 100 || true
            xcrun simctl install "$U" "$APP"
            run() { xcrun simctl terminate "$U" com.pocketappstudio.rowbin 2>/dev/null || true; xcrun simctl launch "$U" com.pocketappstudio.rowbin "$@"; sleep 6; }
            for s in counter voice pattern markup settings; do run -rowbinDemo $s; xcrun simctl io "$U" screenshot "$D/$s.png"; done
            for th in oat night sage berry ocean calm dusk; do run -rowbinDemo pattern -rowbinTheme $th; xcrun simctl io "$U" screenshot "$D/pattern-$th.png"; done
            xcrun simctl shutdown "$U" || true
          }
          shoot "$BIG" iphone
          if [ -n "$SE" ]; then shoot "$SE" iphone-se; fi
          find screens -name '*.png' | sort
      - name: Package simulator app
        if: always()
        run: |
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name 'Rowbin.app' | head -1)
          if [ -n "$APP" ]; then (cd "$(dirname "$APP")" && zip -qr "$GITHUB_WORKSPACE/Rowbin-simulator.zip" Rowbin.app); fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rowbin-ios-simulator
          path: |
            Rowbin-simulator.zip
            screens/**/*.png
            TestResults.xcresult
            build.log
            test.log
          if-no-files-found: ignore
